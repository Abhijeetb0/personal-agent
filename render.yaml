# Render — Agent backend (multi-user: har user ka apna Baileys socket)
services:
  - type: web
    name: personal-agent
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --no-audit --no-fund && npm run build --workspace=agent
    startCommand: npm start --workspace=agent
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Baaki secrets Render Dashboard → Environment me dalo (yaml me mat likho):
      # SUPABASE_URL, SUPABASE_SECRET_KEY, SUPABASE_PUBLISHABLE_KEY,
      # GROQ_API_KEY, GEMINI_API_KEY (optional), AGENT_ENC_KEY (auth_blob encryption)
